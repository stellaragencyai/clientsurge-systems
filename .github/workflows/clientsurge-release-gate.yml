name: ClientSurge Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientsurge-release-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-main:
    name: Verify main before Base44 publish
    runs-on: ubuntu-latest

    env:
      RELEASE_GATE_PROOF_PATH: tmp/release-gate-proof.json

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Prepare production app env
        run: cp .env.example .env.local

      - name: Build app
        run: npm run build

      - name: Run release-gate Node tests
        run: npm run test:release-gate:node

      - name: Run Deno test audit
        continue-on-error: true
        run: npm run test:deno

      - name: Run full Node test audit
        continue-on-error: true
        run: npm run test:node

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/clientsurge-vite-preview.log 2>&1 &
          echo $! > /tmp/clientsurge-vite-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clientsurge-vite-preview.log
          exit 1

      - name: Smoke public routes audit
        continue-on-error: true
        run: npm run smoke:public-routes

      - name: Smoke product signup route
        run: node scripts/product-signup-route-smoke.mjs

      - name: Cloudflare security Worker dry-run
        run: npm run cloudflare:security:dry-run

      - name: Cloudflare route diagnosis audit
        continue-on-error: true
        run: |
          mkdir -p tmp
          set +e
          npm run cloudflare:security:diagnose-route -- --json > tmp/cloudflare-route-diagnosis.json 2>&1
          echo "$?" > tmp/cloudflare-route-diagnosis.exitcode
          exit 0

      - name: Write release gate proof artifact
        run: |
          mkdir -p tmp
          node - <<'NODE'
          const fs = require('node:fs');
          const readOptional = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : null;
          const proof = {
            ok: true,
            proof_type: 'clientsurge_release_gate',
            generated_at: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            event_name: process.env.GITHUB_EVENT_NAME,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            app_id: '69dc4a79656fdba136d413d3',
            domain: 'https://clientsurgesystems.com',
            required_steps: [
              'npm run build',
              'npm run test:release-gate:node',
              'node scripts/product-signup-route-smoke.mjs',
              'npm run cloudflare:security:dry-run'
            ],
            non_blocking_audits: [
              'npm run test:deno',
              'npm run test:node',
              'npm run smoke:public-routes',
              'npm run cloudflare:security:diagnose-route -- --json'
            ],
            cloudflare_route_diagnosis: {
              exit_code: readOptional('tmp/cloudflare-route-diagnosis.exitcode'),
              artifact_path: 'tmp/cloudflare-route-diagnosis.json',
              note: 'Non-blocking until the live custom-domain route is repaired; launch policy still requires production-security verification to pass.'
            },
            downstream_workflow: 'Base44 Auto Publish',
          };
          fs.writeFileSync(process.env.RELEASE_GATE_PROOF_PATH, `${JSON.stringify(proof, null, 2)}\n`);
          NODE

      - name: Upload Cloudflare route diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientsurge-cloudflare-route-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/cloudflare-route-diagnosis.json
            tmp/cloudflare-route-diagnosis.exitcode
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release gate proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientsurge-release-gate-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/release-gate-proof.json
          if-no-files-found: warn
          retention-days: 30

      - name: Release gate summary
        if: always()
        run: |
          echo "## ClientSurge Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required build/test/product-signup/Cloudflare dry-run proof completed before artifact generation." >> "$GITHUB_STEP_SUMMARY"
          echo "- Proof artifact: clientsurge-release-gate-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare route diagnosis artifact: clientsurge-cloudflare-route-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream publish workflow: Base44 Auto Publish via workflow_run on successful main gate." >> "$GITHUB_STEP_SUMMARY"
