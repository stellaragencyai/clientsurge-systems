name: ClientSurge Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientsurge-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-main:
    name: Verify main before Base44 publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Prepare production app env
        run: cp .env.example .env.local

      - name: Build app
        run: npm run build

      - name: Run release-gate Node tests
        run: npm run test:release-gate:node

      - name: Run Deno tests
        run: npm run test:deno

      - name: Run full Node test audit
        continue-on-error: true
        run: npm run test:node

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/clientsurge-vite-preview.log 2>&1 &
          echo $! > /tmp/clientsurge-vite-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clientsurge-vite-preview.log
          exit 1

      - name: Smoke public routes
        run: npm run smoke:public-routes
