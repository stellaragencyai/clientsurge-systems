name: Build Proof

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: npm ci and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public form safety scan
        run: node scripts/audit/public-form-safety-scan.mjs

      - name: Build app
        run: npm run build
