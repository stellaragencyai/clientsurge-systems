name: Sync Base44 Main

on:
  push:
    branches:
      - codex/sync-base44-main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-base44-main
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Fetch remote branches
        run: git fetch origin main codex/sync-base44-main

      - name: Confirm main can fast-forward
        run: |
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "origin/main has diverged from $GITHUB_SHA. Merge main into codex/sync-base44-main first."
            exit 1
          fi

      - name: Promote verified sync branch to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --ff-only "$GITHUB_SHA"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Write workflow summary
        run: |
          {
            echo "## Base44 sync promotion complete"
            echo ""
            echo "- Verified branch: \`codex/sync-base44-main\`"
            echo "- Promoted commit: \`${GITHUB_SHA}\`"
            echo "- Updated branch: \`main\`"
            echo ""
            echo "Base44 should pick up the new \`main\` commit on its normal GitHub sync cycle."
          } >> "$GITHUB_STEP_SUMMARY"
