name: ACTIVE - Deploy ClientSurge Security Edge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "scripts/cloudflare/**"
      - "scripts/public-exposure-live-smoke.mjs"
      - "src/lib/publicRouteMetadata.js"
      - "wrangler.clientsurge-security.toml"
      - ".github/workflows/deploy-clientsurge-security-edge.yml"

concurrency:
  group: clientsurge-security-edge-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFY_URL: https://clientsurgesystems.com
      VERIFY_PRODUCT_SIGNUP_URL: https://clientsurgesystems.com/product-signup?package=growth_system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm active deploy workflow
        run: |
          echo "ACTIVE ClientSurge Cloudflare Security Edge deploy workflow"
          echo "Commit: $GITHUB_SHA"
          echo "Production Worker routes are dashboard-managed; this workflow deploys a tagged Worker version without mutating zone routes."

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure DNS is proxied for Worker routing
        run: node scripts/cloudflare/ensure-proxied-dns.mjs

      - name: Dry-run active Cloudflare Worker
        run: npx wrangler versions upload --config wrangler.clientsurge-security.toml --dry-run

      - name: Upload active Cloudflare Worker version
        run: npx wrangler versions upload --config wrangler.clientsurge-security.toml --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_SHA"

      - name: Deploy uploaded Worker version to 100 percent
        run: npx wrangler versions deploy --config wrangler.clientsurge-security.toml --version-tag "$GITHUB_SHA" --percentage 100 --yes --message "GitHub Actions $GITHUB_SHA"

      - name: Verify current product signup route
        shell: bash
        run: |
          set -euo pipefail
          URL="$VERIFY_PRODUCT_SIGNUP_URL&edge_verify=$(date +%s)"
          echo "Verifying $URL"
          HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$URL")"
          echo "$HTML" | grep -F "Product Signup | ClientSurge Systems"
          echo "$HTML" | grep -F "clientsurge-telegram-click-tracker.js"

      - name: Verify live public route exposure
        run: npm run smoke:public-exposure-live -- --url "$VERIFY_URL"
