name: Deploy ClientSurge Security Edge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "scripts/cloudflare/**"
      - "src/lib/publicRouteMetadata.js"
      - "wrangler.clientsurge-security.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-clientsurge-security-edge.yml"

concurrency:
  group: clientsurge-security-edge-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run edge regression tests
        run: node --test tests/cloudflareSecurityEdgeWrapper.test.js tests/cloudflareSecurityEdge.test.js

      - name: Require Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret. Worker cannot be deployed from GitHub Actions."
            exit 1
          fi

      - name: Deploy Cloudflare security edge
        shell: pwsh
        run: npm run cloudflare:security:release
