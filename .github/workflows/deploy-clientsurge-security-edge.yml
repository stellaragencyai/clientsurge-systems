name: ACTIVE - Deploy ClientSurge Security Edge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "scripts/cloudflare/**"
      - "scripts/public-exposure-live-smoke.mjs"
      - "src/lib/publicRouteMetadata.js"
      - "wrangler.clientsurge-security.toml"
      - ".github/workflows/deploy-clientsurge-security-edge.yml"

concurrency:
  group: clientsurge-security-edge-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFY_URL: https://clientsurgesystems.com
      VERIFY_PRODUCT_SIGNUP_URL: https://clientsurgesystems.com/product-signup?package=growth_system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm active deploy workflow
        run: |
          echo "ACTIVE ClientSurge Cloudflare Security Edge deploy workflow"
          echo "Commit: $GITHUB_SHA"
          echo "This deploy only runs for Cloudflare edge, route metadata, live exposure smoke, or workflow changes."

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure DNS is proxied for Worker routing
        run: node scripts/cloudflare/ensure-proxied-dns.mjs

      - name: Dry-run active Cloudflare Worker
        run: npx wrangler deploy --config wrangler.clientsurge-security.toml --dry-run

      - name: Deploy active Cloudflare Worker
        run: npx wrangler deploy --config wrangler.clientsurge-security.toml

      - name: Upsert Cloudflare Worker routes
        run: node scripts/cloudflare/upsert-worker-routes.mjs

      - name: Verify product signup edge hotfix
        shell: bash
        run: |
          set -euo pipefail
          URL="$VERIFY_PRODUCT_SIGNUP_URL&edge_verify=$(date +%s)"
          echo "Verifying $URL"
          HTML="$(curl -fsSL -H 'Cache-Control: no-cache' "$URL")"
          echo "$HTML" | grep -F "Complete your ClientSurge signup."
          echo "$HTML" | grep -F "Edge hotfix: 2026-07-05-product-signup-edge-hotfix-v1"

      - name: Verify live public route exposure
        run: npm run smoke:public-exposure-live -- --url "$VERIFY_URL"
