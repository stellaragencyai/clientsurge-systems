name: Base44 Auth Secret Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/base44-auth-secret-check.yml"
      - "scripts/base44/check-app-access.mjs"

permissions:
  contents: read

concurrency:
  group: base44-auth-secret-check
  cancel-in-progress: false

jobs:
  check-base44-auth:
    name: Validate Base44 GitHub secret
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      CLIENTSURGE_APP_ID: 69dc4a79656fdba136d413d3
      CLIENTSURGE_VERIFY_URL: https://clientsurgesystems.com/product-signup?package=growth_system
      BASE44_AUTH_JSON: ${{ secrets.BASE44_AUTH_JSON || secrets.BASE_44_AUTH_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate secret exists and can access Base44 app
        run: |
          node scripts/base44/check-app-access.mjs \
            --app-id "$CLIENTSURGE_APP_ID" \
            --verify-url "$CLIENTSURGE_VERIFY_URL" \
            --json

      - name: Summary
        if: always()
        run: |
          echo "## Base44 Auth Secret Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- App ID: $CLIENTSURGE_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secret checked: BASE44_AUTH_JSON preferred, BASE_44_AUTH_JSON fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow never prints the access token or refresh token." >> "$GITHUB_STEP_SUMMARY"
          echo "- If this fails with HTTP 401, replace the Base44 auth secret with a fresh login JSON." >> "$GITHUB_STEP_SUMMARY"
