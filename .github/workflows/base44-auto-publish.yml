name: Base44 Auto Publish (Legacy Manual Fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientsurge-production-release
  cancel-in-progress: false

jobs:
  legacy-manual-fallback:
    name: Legacy deploy endpoint fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      CLIENTSURGE_APP_ID: 69dc4a79656fdba136d413d3
      CLIENTSURGE_VERIFY_URL: https://clientsurgesystems.com
      BASE44_AUTH_JSON: ${{ secrets.BASE44_AUTH_JSON || secrets.BASE_44_AUTH_JSON }}
      BASE44_PUBLISH_PROOF_PATH: tmp/base44-publish-proof.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Explain legacy status
        run: |
          echo "This workflow is retained only as a manual emergency fallback." 
          echo "Normal releases use ClientSurge Production Release, which deploys and verifies the exact merged commit."

      - name: Publish through legacy endpoint
        run: |
          node scripts/base44/publish-deploy-endpoint.mjs \
            --app-id "$CLIENTSURGE_APP_ID" \
            --verify-url "$CLIENTSURGE_VERIFY_URL" \
            --verify-wait-ms 180000 \
            --verify-poll-ms 10000 \
            --summary \
            --output "$BASE44_PUBLISH_PROOF_PATH"

      - name: Upload legacy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-base44-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/base44-publish-proof.json
          if-no-files-found: warn
          retention-days: 30
