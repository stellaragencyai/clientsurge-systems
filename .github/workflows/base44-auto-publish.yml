name: Base44 Auto Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ClientSurge Release Gate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: base44-auto-publish-production
  cancel-in-progress: false

jobs:
  publish-and-prove:
    name: Publish ClientSurge app and prove checkout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    env:
      CLIENTSURGE_APP_ID: 69dc4a79656fdba136d413d3
      CLIENTSURGE_VERIFY_URL: https://clientsurgesystems.com/product-signup?package=growth_system
      CLIENTSURGE_PRODUCT_SIGNUP_SMOKE_BASE_URL: https://clientsurgesystems.com
      CLIENTSURGE_BASE44_APP_ID: 69dc4a79656fdba136d413d3
      CLIENTSURGE_EXPECT_STRIPE_MODE: live
      BASE44_AUTH_JSON: ${{ secrets.BASE44_AUTH_JSON || secrets.BASE_44_AUTH_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tools/browser-audit
          npm run --prefix tools/browser-audit install:browsers

      - name: Verify Base44 auth secret is present
        run: |
          if [ -z "$BASE44_AUTH_JSON" ]; then
            echo "BASE44_AUTH_JSON or BASE_44_AUTH_JSON is missing. Auto-publish cannot run." >&2
            echo "Add a fresh Base44 auth JSON secret in GitHub repository settings, then rerun this workflow." >&2
            exit 1
          fi

      - name: Build before publish
        run: npm run build

      - name: Publish Base44 production app
        run: |
          node scripts/base44/publish-deploy-endpoint.mjs \
            --app-id "$CLIENTSURGE_APP_ID" \
            --verify-url "$CLIENTSURGE_VERIFY_URL" \
            --verify-wait-ms 180000 \
            --verify-poll-ms 10000 \
            --summary

      - name: Verify live product signup route
        env:
          PRODUCT_SIGNUP_SMOKE_STRICT_HTTP: "1"
          PRODUCT_SIGNUP_SMOKE_REQUIRE_BUILT_FALLBACK: "0"
        run: node scripts/product-signup-route-smoke.mjs

      - name: Verify live checkout function creates Stripe session
        run: npm run smoke:product-signup-checkout -- --package growth_system

      - name: Summary
        if: always()
        run: |
          echo "## Base44 Auto Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- App ID: $CLIENTSURGE_APP_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: release-gate success on main, or manual workflow dispatch" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified route: $CLIENTSURGE_VERIFY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live checkout smoke creates a smoke-only Stripe Checkout Session and dashboard-excluded Order." >> "$GITHUB_STEP_SUMMARY"
          echo "- If publish fails with HTTP 401, replace BASE44_AUTH_JSON / BASE_44_AUTH_JSON with a fresh Base44 auth JSON secret." >> "$GITHUB_STEP_SUMMARY"
