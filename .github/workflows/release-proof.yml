name: ClientSurge Release Proof

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-proof:
    name: Build and release proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Prepare CI runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Prepare production app env
        run: cp .env.example .env.local

      - name: Lint audit
        id: lint_audit
        continue-on-error: true
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Node tests audit
        id: node_tests_audit
        continue-on-error: true
        run: npm run test:node --if-present

      - name: Release gate tests
        run: npm run test:release-gate:node --if-present

      - name: Build
        run: npm run build

      - name: Product signup fallback proof
        run: node scripts/product-signup-route-smoke.mjs

      - name: Public route smoke script availability
        run: |
          test -f scripts/public-route-smoke.mjs
          test -f scripts/product-signup-route-smoke.mjs
          test -f scripts/release/prove-production-release.mjs

      - name: Source of truth assertion
        run: |
          grep -R "69dc4a79656fdba136d413d3" base44 src scripts docs package.json public
          grep -R "clientsurgesystems.com" src scripts docs package.json public
          grep -R "stellaragencyai/clientsurge-systems" docs src || true

      - name: Release proof summary
        if: always()
        run: |
          echo "## ClientSurge release proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repo: stellaragencyai/clientsurge-systems" >> "$GITHUB_STEP_SUMMARY"
          echo "- App ID: 69dc4a79656fdba136d413d3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domain: https://clientsurgesystems.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: required in this workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product signup fallback proof: required in this workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: Node 22, Deno, ripgrep, and .env.local prepared to match ClientSurge Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint audit: non-blocking so proof steps still run; release gate remains the blocking source of truth" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full Node tests audit: non-blocking here because ClientSurge Release Gate owns blocking release tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base44 deploy: still requires separate Base44 proof because Base44 reports git_remote_source=s3" >> "$GITHUB_STEP_SUMMARY"
