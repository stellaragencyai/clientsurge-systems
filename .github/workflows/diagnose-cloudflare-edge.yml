name: Diagnose Cloudflare Edge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-cloudflare-edge.yml"
      - "cloudflare/**"
      - "wrangler.clientsurge-security.toml"
      - "scripts/public-exposure-live-smoke.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-cloudflare-edge.yml"
      - "cloudflare/**"
      - "wrangler.clientsurge-security.toml"
      - "scripts/public-exposure-live-smoke.mjs"

permissions:
  contents: read

jobs:
  diagnose:
    name: Strict Cloudflare edge diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFY_URL: https://clientsurgesystems.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Cloudflare secret presence
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Cloudflare secrets are present. Values were not printed."

      - name: Fetch minimal Worker source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare src/lib scripts
          fetch_file() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}" \
              -o "$path"
            echo "Fetched $path"
          }
          fetch_file wrangler.clientsurge-security.toml
          fetch_file cloudflare/clientsurge-security-telegram-wrapper.mjs
          fetch_file cloudflare/clientsurge-production-safe-entry.mjs
          fetch_file cloudflare/clientsurge-product-signup-edge-hotfix.mjs
          fetch_file cloudflare/clientsurge-homepage-repair-wrapper.mjs
          fetch_file cloudflare/clientsurge-security-edge-wrapper.mjs
          fetch_file cloudflare/clientsurge-security-edge-worker.mjs
          fetch_file cloudflare/trust-security-assets.mjs
          fetch_file src/lib/siteDocuments.js
          fetch_file src/lib/publicRouteMetadata.js
          fetch_file scripts/public-exposure-live-smoke.mjs

      - name: Require Wrangler auth
        shell: bash
        run: npx --yes wrangler whoami >/tmp/wrangler-whoami.log 2>&1

      - name: Require Wrangler deploy dry-run
        shell: bash
        run: |
          set +e
          npx --yes wrangler deploy --config wrangler.clientsurge-security.toml --dry-run >/tmp/wrangler-dry-run.log 2>&1
          code=$?
          echo "WRANGLER_DRY_RUN_EXIT=$code"
          tail -120 /tmp/wrangler-dry-run.log
          exit $code

      - name: Require live homepage exposure smoke after merge
        if: github.event_name != 'pull_request'
        shell: bash
        run: node scripts/public-exposure-live-smoke.mjs --url "$VERIFY_URL"
