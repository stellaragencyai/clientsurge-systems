name: Diagnose Cloudflare Edge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-cloudflare-edge.yml"
      - "cloudflare/**"
      - "wrangler.clientsurge-security.toml"
      - "scripts/public-exposure-live-smoke.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-cloudflare-edge.yml"
      - "cloudflare/**"
      - "wrangler.clientsurge-security.toml"
      - "scripts/public-exposure-live-smoke.mjs"

permissions:
  contents: read

jobs:
  diagnose:
    name: Strict Cloudflare edge diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFY_URL: https://clientsurgesystems.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare secret presence
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Cloudflare secrets are present. Values were not printed."

      - name: Require Wrangler auth
        shell: bash
        run: npx wrangler whoami >/tmp/wrangler-whoami.log 2>&1

      - name: Require Wrangler deploy dry-run
        shell: bash
        run: npx wrangler deploy --config wrangler.clientsurge-security.toml --dry-run >/tmp/wrangler-dry-run.log 2>&1

      - name: Require live homepage exposure smoke
        shell: bash
        run: npm run smoke:public-exposure-live -- --url "$VERIFY_URL"
