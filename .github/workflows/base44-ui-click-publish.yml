name: Base44 UI Click Publish (Manual Emergency Fallback)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only verify that the Publish control is reachable"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: clientsurge-production-release
  cancel-in-progress: false

jobs:
  click-publish:
    name: Manually invoke Base44 Publish button fallback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      BASE44_STORAGE_STATE_JSON: ${{ secrets.BASE44_STORAGE_STATE_JSON }}
      BASE44_AUTH_JSON: ${{ secrets.BASE44_AUTH_JSON || secrets.BASE_44_AUTH_JSON }}
      BASE44_DASHBOARD_URL: https://app.base44.com/apps/69dc4a79656fdba136d413d3/editor/workspace/overview
      BASE44_UI_PUBLISH_PROOF_PATH: tmp/base44-ui-click-publish-proof.json

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and browser
        run: |
          npm ci
          npm ci --prefix tools/browser-audit
          npm run --prefix tools/browser-audit install:browsers

      - name: Verify Base44 UI session
        shell: bash
        run: |
          if [ -z "$BASE44_STORAGE_STATE_JSON" ] && [ -z "$BASE44_AUTH_JSON" ]; then
            echo "Base44 UI authentication is missing." >&2
            exit 1
          fi

      - name: Build before fallback publish
        run: npm run build

      - name: Invoke Publish control
        shell: bash
        run: |
          mkdir -p tmp
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run base44:publish-ui -- --dry-run --headless --timeout-ms 180000 --output "$BASE44_UI_PUBLISH_PROOF_PATH"
          else
            npm run base44:publish-ui -- --yes --headless --timeout-ms 180000 --output "$BASE44_UI_PUBLISH_PROOF_PATH"
          fi

      - name: Upload fallback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-base44-ui-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/base44-ui-click-publish-proof.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Manual Base44 UI Fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow no longer auto-triggers after every main release." >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical deployment: ClientSurge Production Release." >> "$GITHUB_STEP_SUMMARY"
