<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#00AEEF" />
    <title>Offline | ClientSurge Systems</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
        font-family: Inter, Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f7fbff 0%, #ffffff 48%, #eef8ff 100%);
        color: #0f172a;
      }
      main {
        width: min(520px, 100%);
        border: 1px solid #dbeafe;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        padding: 28px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 900;
        background: linear-gradient(135deg, #003b8f, #00aeef);
        margin-bottom: 16px;
      }
      h1 { margin: 0 0 10px; font-size: clamp(1.65rem, 8vw, 2.4rem); line-height: 1; letter-spacing: -0.04em; }
      p { margin: 0; color: #475569; line-height: 1.65; font-size: 16px; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
      a, button {
        min-height: 44px;
        min-width: 44px;
        border-radius: 999px;
        padding: 0 18px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      a { display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(90deg, #0079c1, #005691); color: white; text-decoration: none; }
      button { border: 1px solid #cbd5e1; background: white; color: #0f172a; }
      :focus-visible { outline: 2px solid #00aeef; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="badge" aria-hidden="true">CS</div>
      <h1>You are offline</h1>
      <p>ClientSurge needs a connection for live dashboards, setup status, payments, and messaging. Reconnect and try again.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry</button>
        <a href="/contact">Contact Support</a>
      </div>
    </main>
  </body>
</html>
